name: Rydd
options:
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
# Release is the website build (Developer ID, notarized); AppStore is the Mac App Store build.
# Both run in the App Sandbox with no network entitlement. They differ only in how they are
# signed and in the menu, where the website build links to its download page for updates.
# The Swift package next to this file builds the same code unsandboxed for development and the CLI.
configs:
  Debug: debug
  Release: release
  AppStore: release
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Rydd:
    type: application
    platform: macOS
    sources:
      - path: Sources/RyddCore
      - path: Sources/RyddApp
      - path: Resources
      - path: App
        excludes:
          - Info.plist
          - Rydd.entitlements
    settings:
      configs:
        AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
      base:
        PRODUCT_NAME: Rydd
        PRODUCT_BUNDLE_IDENTIFIER: com.feiyangtang.Rydd
        # The release scripts pass the team (X933P26489) and signing identity; local builds sign ad hoc.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: App/Rydd.entitlements
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rydd
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 TangSpark. Apache License 2.0."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
