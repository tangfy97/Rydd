name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Choose the folder …
        2. Open Review and …
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Rydd and macOS versions
      description: Rydd menu ▸ About Rydd, and  ▸ About This Mac.
      placeholder: Rydd 1.0, macOS 26.1, Apple M2
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files involved
      description: Rough kinds of files and folders (for example "PDF invoices in Downloads, a Documents/Finance folder"). Please don't paste private file names.
